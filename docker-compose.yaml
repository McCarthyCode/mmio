name: mmio

services:
  www:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: development
      APP_DEBUG: "true"
      APP_PORT: "8080"
      APP_WORKERS: "1"
      LOG_LEVEL: debug
    volumes:
      - ./app:/app
    command: ["flask", "run", "--host=0.0.0.0", "--port=8080", "--debug"]
