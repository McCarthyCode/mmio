name: mmio
region: nyc

# A static-only app is on App Platform's free tier. The build runs Flask once
# (app/freeze.py) and publishes the rendered files; nothing runs at request time.
static_sites:
  - name: www
    github:
      repo: McCarthyCode/mmio
      branch: main
      deploy_on_push: true
    source_dir: app
    build_command: python freeze.py build
    output_dir: build

domains:
  - domain: mattmccarthy.io
    type: PRIMARY
  - domain: www.mattmccarthy.io
    type: ALIAS
  - domain: mattmccarthy.net
    type: ALIAS
  - domain: www.mattmccarthy.net
    type: ALIAS
  - domain: mattmccarthy.org
    type: ALIAS
  - domain: www.mattmccarthy.org
    type: ALIAS
  - domain: mccarthycode.com
    type: ALIAS
  - domain: www.mccarthycode.com
    type: ALIAS

# Replicates today's nginx behavior: mattmccarthy.io (+ www) serves the app directly;
# mattmccarthy.net/.org and mccarthycode.com (+ www) 301-redirect to mattmccarthy.io.
ingress:
  rules:
    - match:
        authority:
          exact: mattmccarthy.net
      redirect:
        authority: mattmccarthy.io
        scheme: https
        redirect_code: 301
    - match:
        authority:
          exact: www.mattmccarthy.net
      redirect:
        authority: mattmccarthy.io
        scheme: https
        redirect_code: 301
    - match:
        authority:
          exact: mattmccarthy.org
      redirect:
        authority: mattmccarthy.io
        scheme: https
        redirect_code: 301
    - match:
        authority:
          exact: www.mattmccarthy.org
      redirect:
        authority: mattmccarthy.io
        scheme: https
        redirect_code: 301
    - match:
        authority:
          exact: mccarthycode.com
      redirect:
        authority: mattmccarthy.io
        scheme: https
        redirect_code: 301
    - match:
        authority:
          exact: www.mccarthycode.com
      redirect:
        authority: mattmccarthy.io
        scheme: https
        redirect_code: 301
    - component:
        name: www
      match:
        path:
          prefix: /
