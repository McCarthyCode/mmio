services:
  www:
    image: python:latest
    restart: unless-stopped
    command: /bin/sh -c "cd /app && python3 -m http.server 8080"
    volumes:
      - ./app:/app
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
