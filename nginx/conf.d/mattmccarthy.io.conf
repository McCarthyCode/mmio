server {
    listen 443 ssl;
    server_name mattmccarthy.io www.mattmccarthy.io stage.mattmccarthy.io;

    ssl_certificate     /etc/ssl/certs/mattmccarthy.io.crt;
    ssl_certificate_key /etc/ssl/private/mattmccarthy.io.key;

    location / {
        proxy_pass http://www:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' https://cdn.jsdelivr.net https://cloudflareinsights.com; object-src 'none';" always;
    }
}
